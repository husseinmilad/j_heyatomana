name: Build Windows desktop installer

on:
  push:
    branches:
      - desktop/windows-json-storage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows Setup.exe
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: heyatomana-windows-setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
